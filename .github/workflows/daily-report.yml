name: Satir Model Daily Report

on:
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"

      - name: Determine date
        id: date
        run: |
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            TARGET="$INPUT_DATE"
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Fetch papers from PubMed
        run: node scripts/fetch_papers.mjs
        env:
          TARGET_DATE: ${{ steps.date.outputs.target }}
          DAYS_BACK: "7"
          MAX_PAPERS: "40"
        timeout-minutes: 10
        continue-on-error: true

      - name: Check papers data
        id: papers
        run: |
          if [ -f papers.json ] && python3 -c "import json; json.load(open('papers.json'))" 2>/dev/null; then
            COUNT=$(node -e "const d=require('./papers.json'); console.log((d.papers||[]).length)")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo '{"date":"unknown","count":0,"papers":[]}' > papers.json
          fi

      - name: Generate report with Zhipu AI
        if: steps.papers.outputs.count != '0'
        run: node scripts/generate_report.mjs
        env:
          TARGET_DATE: ${{ steps.date.outputs.target }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          MAX_TOKENS: "50000"
          TIMEOUT_MS: "480000"
        timeout-minutes: 15

      - name: Generate no-papers report
        if: steps.papers.outputs.count == '0'
        run: node -e "
        const d=process.env.TARGET_DATE;
        const dayN=['日','一','二','三','四','五','六'];
        const wd=new Date(d+'T00:00:00+08:00').getDay();
        const fs=require('fs');
        fs.writeFileSync('docs/satir-'+d+'.html',\`<!DOCTYPE html>
<html lang=\"zh-TW\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">
<title>薩提爾模式每日報告 \${d}</title>
<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap\" rel=\"stylesheet\">
<style>:root{--bg:#f6f1e8;--surface:#fffaf2;--line:#d8c5ab;--text:#2b2118;--muted:#766453;--accent:#8c4f2b;--accent-soft:#ead2bf;--card-bg:color-mix(in srgb,var(--surface) 92%,white)}*{margin:0;padding:0;box-sizing:border-box}body{background:radial-gradient(circle at top,#fff6ea 0,var(--bg) 55%,#ead8c6 100%);font-family:\"Noto Sans TC\",\"PingFang TC\",\"Helvetica Neue\",Arial,sans-serif;color:var(--text);min-height:100vh;line-height:1.6;display:flex;align-items:center;justify-content:center}.container{max-width:640px;margin:0 auto;padding:40px 20px;text-align:center}h1{font-size:1.5em;margin-bottom:8px;color:var(--text)}.date-line{color:var(--muted);font-size:0.92em;margin-bottom:24px}.message{background:var(--card-bg);border-radius:20px;padding:32px 28px;box-shadow:0 2px 10px rgba(139,79,43,0.06);margin-bottom:24px;font-size:0.95em;color:var(--text)}.footer{border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.footer a{color:var(--accent);text-decoration:none;font-size:0.88em;margin:0 12px}.footer a:hover{text-decoration:underline}.footer-copy{color:var(--muted);font-size:0.78em;margin-top:12px}</style>
</head><body><div class=\"container\">
<h1>🏔️ 薩提爾模式每日研究文獻報告</h1>
<p class=\"date-line\">\${d}（星期\${dayN[wd]}）</p>
<div class=\"message\">📋 今日尚無新的薩提爾模式相關研究文獻。<br><br>PubMed 搜尋範圍涵蓋 Satir Model、Satir family therapy、Satir Growth Model、Satir Transformational Systemic Therapy 等關鍵詞。薩提爾模式為專業家族治療領域，新文獻發表頻率較低，敬請持續關注。</div>
<div class=\"footer\"><p>
<a href=\"https://www.leepsyclinic.com/\" target=\"_blank\" rel=\"noopener noreferrer\">🏥 李政洋身心診所首頁</a>
<a href=\"https://blog.leepsyclinic.com/\" target=\"_blank\" rel=\"noopener noreferrer\">📬 訂閱電子報</a>
<a href=\"https://buymeacoffee.com/CYlee\" target=\"_blank\" rel=\"noopener noreferrer\">☕ Buy me a coffee</a>
</p><p class=\"footer-copy\">Powered by Zhipu AI + GitHub Actions</p></div>
</div></body></html>\`);
        console.log('No-papers report generated for',d);"
        env:
          TARGET_DATE: ${{ steps.date.outputs.target }}

      - name: Generate index page
        run: node scripts/generate_index.mjs
        timeout-minutes: 5

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "satir daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push
